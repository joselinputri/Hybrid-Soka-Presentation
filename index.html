<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FireBat (Firefly × Bat) | Penjadwalan Tugas Cloud</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23040817'/%3E%3Ccircle cx='24' cy='34' r='14' fill='%2338bdf8' opacity='.4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23fbbf24'/%3E%3Cpath d='M34 28l7-7 4 7 4-7 7 7-4 13-7 4-7-4z' fill='%23a855f7' opacity='.85'/%3E%3C/svg%3E" />

  <!-- Fonts: Sora (Headings), Manrope (Body), Red Hat Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Red+Hat+Mono:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Clean Observatory Style -->
  <link rel="stylesheet" href="./styles/clean.css" />
</head>
<body>
  <!-- 3D Topological Ambient Background -->
  <div id="bg-3d"></div>

  <!-- Minimal Foreground Presentation Deck -->
  <div class="deck-root">
    <!-- Top Nav -->
    <header class="deck-top">
      <div class="brand-pill">
        <span class="brand-dot"></span>
        <span>FIREBAT HYBRID · DEMO 1</span>
      </div>

      <!-- Navigation Dots -->
      <nav class="nav-dots" id="nav-dots" aria-label="Slide Dots"></nav>

      <div class="top-actions">
        <button class="icon-btn" id="btn-notes" title="Catatan Presenter (N)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>
        </button>
        <button class="icon-btn" id="btn-fs" title="Layar Penuh (F)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Slide Stage -->
    <main class="deck-main" id="deck-main"></main>

    <!-- Bottom Nav -->
    <footer class="deck-bottom">
      <div class="counter-text" id="deck-counter">01 / 07</div>

      <div class="arrow-group">
        <button class="arrow-btn" id="btn-prev" title="Sebelumnya (←)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button class="arrow-btn" id="btn-next" title="Berikutnya (→ / Spasi)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </footer>

    <!-- Speaker Notes Modal -->
    <div class="notes-modal hidden" id="notes-modal">
      <div class="notes-head">
        <span>Catatan Bicara Presenter</span>
        <button id="btn-close-notes" style="background:none;border:none;color:var(--ink-secondary);font-size:22px;cursor:pointer;line-height:1;">&times;</button>
      </div>
      <p class="notes-text" id="notes-text"></p>
    </div>
  </div>

  <!-- Three.js and OrbitControls (Offline bundled in lib/) -->
  <script src="./lib/three.min.js"></script>
  <script src="./lib/OrbitControls.js"></script>

  <!-- Application Logic -->
  <script src="./js/ambient3d.js"></script>
  <script src="./js/story3d.js"></script>
  <script src="./js/interactiveSim3d.js"></script>
  <script src="./js/resultChart3d.js"></script>
  <script src="./js/cleanSlides.js"></script>
  <script src="./js/cleanApp.js"></script>
</body>
</html>
